<!doctype html>
<html lang="en-US">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#793544"><title>RUWithMe — Your PhD workspace</title><link rel="icon" href="/ru-mark.svg"><script src="/appearance.js"></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/calendar.css"><script src="/calendar-ui.js" defer></script><link rel="stylesheet" href="/todos.css"><script src="/todo-ui.js" defer></script><link rel="stylesheet" href="/commitments.css"><link rel="stylesheet" href="/task-cards.css"><script src="/commitment-ui.js" defer></script><link rel="stylesheet" href="/track.css"><script src="/track-ui.js" defer></script><link rel="stylesheet" href="/daily.css"><script src="/daily-ui.js" defer></script><link rel="stylesheet" href="/research.css"><script src="/research-ui.js" defer></script><link rel="stylesheet" href="/sessions.css"><script src="/workspace-mode-ui.js" defer></script><script src="/sessions-ui.js" defer></script><script src="/freshness-ui.js" defer></script><link rel="stylesheet" href="/appearance.css"><link rel="stylesheet" href="/content.css"><script src="/content-ui.js" defer></script><link rel="stylesheet" href="/polish.css"><script src="/today-ui.js" defer></script><script src="/materials-ui.js" defer></script><script src="/pdf-ui.js" defer></script><script src="/local-events-ui.js" defer></script><script src="/app.js" defer></script></head>
<body>
 <div class="shell">
  <aside class="sidebar"><a href="#today" class="brand"><img src="/ru-mark.svg" alt="RU"><span>RUWithMe<small>Your daily companion</small></span></a><nav aria-label="Main navigation"><button data-nav="today"><span class="nav-icon">☀</span><span>Today</span></button><p class="nav-label">WORKSPACE</p><button data-nav="research"><span class="nav-icon">◇</span><span>Research</span></button><button data-nav="courses"><span class="nav-icon">▤</span><span>Courses</span></button><button data-nav="learn"><span class="nav-icon">◉</span><span>Learn</span></button><details id="more-spaces" class="space-nav"><summary>More spaces <span aria-hidden="true">⌄</span></summary><button data-nav="career"><span class="nav-icon">↗</span><span>Career</span></button><button data-nav="admin"><span class="nav-icon">▥</span><span>Admin</span></button><button data-nav="personal"><span class="nav-icon">⌂</span><span>Personal</span></button></details><div class="nav-rule"></div><button data-nav="track"><span class="nav-icon">◴</span><span>Track</span></button><button data-nav="calendar"><span class="nav-icon">◷</span><span>Calendar</span></button><button data-nav="inbox"><span class="nav-icon">▱</span><span>Inbox</span></button></nav><div class="sidebar-bottom"><span class="connection-dot"></span><span id="file-status">Local workspace</span></div></aside>
  <main><header class="topbar"><div><span class="crumb">RUWithMe / </span><strong id="breadcrumb">Today</strong></div><div class="page-actions"><details id="text-size-menu" class="text-size-menu"><summary aria-label="Text size" title="Text size (100%)">Aa</summary><div class="text-size-panel"><strong>Text size</strong><div class="text-size-controls" role="group" aria-label="Adjust text size"><button type="button" data-text-size="smaller" aria-label="Decrease text size">A−</button><output aria-label="Current text size" aria-live="polite">100%</output><button type="button" data-text-size="larger" aria-label="Increase text size">A+</button></div><button type="button" class="button text-size-reset" data-text-size="reset">Reset to default</button><p class="text-size-note">Saved in this browser.</p></div></details><button class="button" data-session-new="">+ Log a session</button><button class="button" data-todo-new="all">+ Todo</button><button id="open-daily" class="button daily-toggle">✧ Daily</button></div></header><div class="page" id="page" aria-live="polite"></div></main>
  <aside class="daily" aria-label="Daily assistant"><header class="daily-header"><h2>Daily</h2><button id="new-daily" class="text-button daily-new" title="Start a fresh conversation; the previous chat can be restored">New chat</button><button id="codex-status" class="pill">Connecting…</button><button id="close-daily" class="icon-button" aria-label="Close Daily">×</button></header><div class="daily-context" id="daily-context">Your new workspace</div><div id="messages" class="messages" role="log" aria-label="Conversation"></div><div id="track-review" hidden></div><p id="daily-progress" class="daily-progress" role="status"></p><div class="daily-controls"><button id="stop-daily" class="text-button" hidden>Stop task</button><button id="restore-daily" class="text-button" title="Restore the previous locally archived conversation" hidden>Restore previous</button><button id="check-daily" class="text-button">Check connection</button></div><form id="chat-form" class="composer"><label class="sr-only" for="chat-input">Message Daily</label><textarea id="chat-input" placeholder="Start here with Daily…" rows="3"></textarea><button id="send-message" class="send-button" disabled aria-label="Send message">↑</button></form><p class="daily-footnote">Your Codex subscription · Your workspace files</p></aside>
 </div>
 <dialog id="dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Close dialog">×</button></header><div id="dialog-body"></div></dialog>
 <input id="inbox-files" type="file" multiple accept=".pdf,.html,.htm,.md,.txt,.tex,.png,.jpg,.jpeg,.webp,.csv,.json,.py,.r,.js" hidden>
 <div id="notice" class="notice" role="status" hidden></div>
</body></html>
